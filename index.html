<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Tina und Stef's Rezepte</title>

  <meta name="theme-color" content="#0b3b32">
  <meta name="background-color" content="#f6f3ee">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="T&S Rezepte">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f6f3ee;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: #f6f3ee;
      color: #0b3b32;
      transition: opacity .25s ease;
    }

    #splash img {
      width: 132px;
      height: 132px;
      border-radius: 28px;
      box-shadow: 0 6px 24px rgba(0,0,0,.10);
    }

    #splash h1 {
      margin: 0;
      font-size: 24px;
    }

    #splash p {
      margin: 0;
      color: #6e6257;
    }

    #appFrame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #f6f3ee;
    }

    #fallback {
      display: none;
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      text-align: center;
    }

    #fallback a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      background: #0b3b32;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div id="splash">
    <img src="icon-192.png" alt="T&S Rezepte">
    <h1>Tina und Stef's Rezepte</h1>
    <p>Oisi persönlichä Rezäpt</p>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzaKqxzztyH-l_cfXErC3yHdpWQP_knvGGizO7Sg6vfU_R_GKd_bDCbK2ip0hqs753s/exec"
    title="Tina und Stef's Rezepte"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <div id="fallback">
    <a href="https://script.google.com/macros/s/AKfycbzaKqxzztyH-l_cfXErC3yHdpWQP_knvGGizO7Sg6vfU_R_GKd_bDCbK2ip0hqs753s/exec" target="_blank" rel="noopener">
      App direkt öffnen
    </a>
  </div>

  <script>
    const frame = document.getElementById('appFrame');
    const splash = document.getElementById('splash');
    const fallback = document.getElementById('fallback');

    frame.addEventListener('load', () => {
      setTimeout(() => {
        splash.style.opacity = '0';
        setTimeout(() => {
          splash.style.display = 'none';
        }, 250);
      }, 250);
    });

    // Falls das Einbetten auf einem Gerät/Browser nicht klappt,
    // bleibt ein direkter Startknopf verfügbar.
    setTimeout(() => {
      if (splash.style.display !== 'none') {
        fallback.style.display = 'block';
      }
    }, 8000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>

</body>
</html>
