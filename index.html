<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Tina und Stef's Rezepte</title>

  <meta name="theme-color" content="#0b3b32">
  <meta name="background-color" content="#f6f3ee">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="T&S Rezepte">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --green: #0b3b32;
      --cream: #f6f3ee;
      --cream-deep: #eee8df;
      --taupe: #9b8b7b;
      --text-soft: #6e6257;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--cream);
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(24px, env(safe-area-inset-top))
        24px
        max(24px, env(safe-area-inset-bottom));
      background:
        radial-gradient(
          circle at center 35%,
          #fbf9f5 0%,
          var(--cream) 52%,
          var(--cream-deep) 100%
        );
      color: var(--green);
      opacity: 1;
      transition:
        opacity .45s ease,
        visibility .45s ease;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      width: min(92vw, 390px);
      text-align: center;
      transform: translateY(-2vh);
    }

    .logo-wrap {
      width: 220px;
      height: 220px;
      margin: 0 auto 28px;
      padding: 7px;
      border-radius: 42px;
      background: rgba(255, 255, 255, .52);
      box-shadow:
        0 14px 34px rgba(11, 59, 50, .11),
        0 2px 8px rgba(0, 0, 0, .05);
      animation: logoBreath 2.2s ease-in-out infinite;
    }

    .logo-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 35px;
      object-fit: cover;
    }

    .greeting {
      margin: 0 0 10px;
      color: var(--taupe);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .25px;
      opacity: 0;
      transform: translateY(7px);
      animation: textReveal .5s ease 3.20s forwards;
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 32px);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -.4px;
      opacity: 0;
      transform: translateY(7px);
      animation: textReveal .55s ease 3.45s forwards;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--text-soft);
      font-size: 16px;
      letter-spacing: .2px;
      opacity: 0;
      transform: translateY(7px);
      animation: textReveal .55s ease 3.70s forwards;
    }

    .loader {
      width: min(250px, 72vw);
      margin: 34px auto 0;
      opacity: 0;
      transform: translateY(6px);
      animation: textReveal .5s ease 4.00s forwards;
    }

    .progress-track {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(11, 59, 50, .11);
    }

    .progress-bar {
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: var(--green);
      animation: progressMove 1.35s ease-in-out infinite;
    }

    .loading-row {
      min-height: 24px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--taupe);
      font-size: 13px;
    }

    .dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      animation: dotPulse 1.2s infinite ease-in-out;
    }

    .dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .dots span:nth-child(3) {
      animation-delay: .3s;
    }

    #slowMessage {
      display: none;
      margin-top: 14px;
      color: var(--text-soft);
      font-size: 12px;
      line-height: 1.4;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--cream);
    }

    #fallback {
      display: none;
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 30;
      text-align: center;
    }

    #fallback a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(11, 59, 50, .18);
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(-2vh);
      }
    }

    @keyframes logoBreath {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.025);
      }
    }

    @keyframes progressMove {
      0% {
        transform: translateX(-115%);
      }
      50% {
        transform: translateX(110%);
      }
      100% {
        transform: translateX(255%);
      }
    }

    @keyframes dotPulse {
      0%, 80%, 100% {
        opacity: .28;
        transform: scale(.82);
      }
      40% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes textReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <div id="splash" aria-live="polite">
    <div class="splash-card">

      <div class="logo-wrap">
        <img
          src="icon-192.png"
          alt="Tina und Stef's Rezepte"
        >
      </div>

      <p
        id="greeting"
        class="greeting"
      >
        Guete Tag
      </p>

      <h1>Tina und Stef's Rezepte</h1>

      <p class="subtitle">
        Eusi persönlichä Rezäpt
      </p>

      <div class="loader">
        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>

        <div class="loading-row">
          <span id="loadingText">Chuchi wird vorbereitet</span>

          <span class="dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </div>

        <div id="slowMessage">
          Es dauert gerade etwas länger – gleich geht's weiter.
        </div>
      </div>

    </div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzaKqxzztyH-l_cfXErC3yHdpWQP_knvGGizO7Sg6vfU_R_GKd_bDCbK2ip0hqs753s/exec"
    title="Tina und Stef's Rezepte"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <div id="fallback">
    <a
      href="https://script.google.com/macros/s/AKfycbzaKqxzztyH-l_cfXErC3yHdpWQP_knvGGizO7Sg6vfU_R_GKd_bDCbK2ip0hqs753s/exec"
      target="_blank"
      rel="noopener"
    >
      App direkt öffnen
    </a>
  </div>

  <script>
    const frame =
      document.getElementById('appFrame');

    const splash =
      document.getElementById('splash');

    const slowMessage =
      document.getElementById('slowMessage');

    const fallback =
      document.getElementById('fallback');

    const greeting =
      document.getElementById('greeting');

    const loadingText =
      document.getElementById('loadingText');

    let appLoaded = false;

    // Der Startbildschirm bleibt mindestens so lange sichtbar,
    // damit Begrüssung und Ladehinweise wahrgenommen werden können.
    const splashStartedAt = Date.now();
    const MIN_SPLASH_TIME = 7200;


    // Begrüssung passend zur lokalen Uhrzeit des Geräts.
    const currentHour =
      new Date().getHours();

    if (currentHour < 11) {
      greeting.textContent = 'Guete Morgä';
    } else if (currentHour < 17) {
      greeting.textContent = 'Guete Tag';
    } else {
      greeting.textContent = 'Guete Abig';
    }


    // Kleine wechselnde Texte während des Ladens.
    const loadingMessages = [
      'Chuchi wird vorbereitet',
      'Rezepte werden geladen',
      'En Guete!'
    ];

    let loadingMessageIndex = 0;

    const loadingMessageTimer =
      setInterval(
        () => {
          loadingMessageIndex =
            (loadingMessageIndex + 1) %
            loadingMessages.length;

          loadingText.style.opacity = '0';

          setTimeout(
            () => {
              loadingText.textContent =
                loadingMessages[loadingMessageIndex];

              loadingText.style.opacity = '1';
            },
            180
          );
        },
        1150
      );

    loadingText.style.transition =
      'opacity .18s ease';

    frame.addEventListener(
      'load',
      () => {
        appLoaded = true;

        const elapsed =
          Date.now() - splashStartedAt;

        const remaining =
          Math.max(
            MIN_SPLASH_TIME - elapsed,
            0
          );

        // Die Meldungen dürfen während der Mindestanzeige weiterlaufen.
        // Kurz vor dem Wechsel erscheint nochmals „En Guete!“.
        setTimeout(
          () => {
            loadingText.style.opacity = '0';

            setTimeout(
              () => {
                loadingText.textContent = 'En Guete!';
                loadingText.style.opacity = '1';
              },
              180
            );
          },
          Math.max(remaining - 650, 0)
        );

        setTimeout(
          () => {
            clearInterval(loadingMessageTimer);
            splash.classList.add('hide');
          },
          remaining + 320
        );
      }
    );

    setTimeout(
      () => {
        if (!appLoaded) {
          slowMessage.style.display = 'block';
        }
      },
      4500
    );

    setTimeout(
      () => {
        if (!appLoaded) {
          fallback.style.display = 'block';
        }
      },
      9000
    );

    if ('serviceWorker' in navigator) {
      window.addEventListener(
        'load',
        () => {
          navigator
            .serviceWorker
            .register('./service-worker.js?v=6')
            .catch(() => {
              // Die App funktioniert auch ohne Service Worker.
            });
        }
      );
    }
  </script>

</body>
</html>
